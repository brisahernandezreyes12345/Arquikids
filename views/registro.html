<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArquiKids — Configuración inicial</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      text-align: center;
    }
    .logo { font-size: 64px; margin-bottom: 8px; }
    h1 { color: #1a1a2e; font-size: 26px; margin-bottom: 6px; }
    p.sub { color: #666; font-size: 14px; margin-bottom: 32px; line-height: 1.5; }
    label {
      display: block; text-align: left; font-size: 13px;
      font-weight: 600; color: #333; margin-bottom: 6px;
    }
    input {
      width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0;
      border-radius: 10px; font-size: 15px; margin-bottom: 20px;
      outline: none; transition: border-color .2s;
    }
    input:focus { border-color: #0f3460; }
    button[type="submit"] {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #0f3460, #533483);
      color: white; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      transition: opacity .2s;
    }
    button[type="submit"]:hover { opacity: .9; }
    #error { color: #e53935; font-size: 13px; margin-top: 12px; display: none; }
    #exito { color: #43a047; font-size: 14px; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏫</div>
    <h1>Configuración inicial</h1>
    <p class="sub">Ingresa los datos de tu institución para comenzar a usar ArquiKids.</p>

    <label for="escuela">Nombre de la escuela *</label>
    <input type="text" id="escuela" placeholder="Ej: Escuela Primaria Benito Juárez" maxlength="100" />

    <label for="correo">Correo de contacto *</label>
    <input type="email" id="correo" placeholder="contacto@escuela.edu.mx" />

    <button type="submit" onclick="guardar()">Guardar y continuar →</button>
    <div id="error">⚠️ <span id="error-msg"></span></div>
    <div id="exito">✅ ¡Configuración guardada! Iniciando...</div>
  </div>

  <script>
    async function guardar() {
      const escuela  = document.getElementById('escuela').value.trim();
      const correo   = document.getElementById('correo').value.trim();
      const errorDiv = document.getElementById('error');
      const errorMsg = document.getElementById('error-msg');
      const exitoDiv = document.getElementById('exito');

      errorDiv.style.display = 'none';

      if (!escuela || !correo) {
        errorMsg.textContent = 'Todos los campos son obligatorios.';
        errorDiv.style.display = 'block';
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
        errorMsg.textContent = 'Ingresa un correo electrónico válido.';
        errorDiv.style.display = 'block';
        return;
      }

      // Guardamos escuela y correo usando el nickname y avatar de la DB
      try {
        const res = await fetch('/api/guardar-config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ escuela, correo })
        });

        if (res.ok) {
          localStorage.setItem('arquikids_config', JSON.stringify({ escuela, correo }));
          exitoDiv.style.display = 'block';
          setTimeout(() => { window.location.href = '/static/index.html'; }, 1500);
        } else {
          errorMsg.textContent = 'Error al guardar. Intenta de nuevo.';
          errorDiv.style.display = 'block';
        }
      } catch (e) {
        errorMsg.textContent = 'Error de conexión con el servidor.';
        errorDiv.style.display = 'block';
      }
    }
  </script>
</body>
</html>
