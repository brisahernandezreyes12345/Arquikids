<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construye tu PC - Inicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .bg-gradient-custom {
            background: radial-gradient(circle at center, #2563eb 0%, #1e40af 100%);
        }
    </style>
</head>
<body class="bg-gradient-custom h-screen flex items-center justify-center overflow-hidden">

    <div class="text-center px-4 max-w-4xl">
        <div class="mb-8 flex justify-center">
            <svg width="240" height="200" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="40" y="20" width="160" height="110" rx="10" fill="#3b82f6" fill-opacity="0.3" stroke="white" stroke-width="4"/>
                <rect x="50" y="30" width="140" height="85" rx="5" fill="#1d4ed8" fill-opacity="0.5"/>
                <rect x="110" y="130" width="20" height="15" fill="white"/>
                <rect x="90" y="145" width="60" height="5" rx="2.5" fill="white"/>
                <rect x="10" y="80" width="45" height="70" rx="5" fill="white" fill-opacity="0.2" stroke="white" stroke-width="2"/>
                <circle cx="20" cy="135" r="3" fill="#4ade80"/>
                <rect x="65" y="160" width="110" height="30" rx="4" fill="white" fill-opacity="0.8"/>
                <rect x="75" y="170" width="90" height="10" rx="2" fill="#1e40af" fill-opacity="0.2"/>
            </svg>
        </div>

        <h1 class="text-white text-6xl md:text-7xl font-bold mb-4 tracking-tight">
            ¡Construye tu PC!
        </h1>

        <p class="text-blue-100 text-xl md:text-2xl mb-2 font-light">
            Aprende sobre las partes de una computadora mientras te diviertes
        </p>
        
        <div class="text-3xl mb-12 animate-bounce"></div>

        <div class="flex flex-col md:flex-row gap-4 justify-center items-center">
            <a href="perfil.html" class="bg-white text-blue-700 px-10 py-4 rounded-full font-bold text-xl shadow-xl hover:scale-105 transition-transform flex items-center gap-2">
                <span class="text-blue-400">✧</span> ¡Empezar Ahora!
            </a>

            <a href="catalogo.html" class="bg-blue-500 bg-opacity-30 border-2 border-blue-400 text-white px-10 py-4 rounded-full font-bold text-xl hover:bg-opacity-50 transition-all flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 240 200" stroke="currentColor">
                    <rect x="60" y="70" width="120" height="80" rx="10" stroke-width="15"/>
                    <circle cx="120" cy="110" r="15" fill="currentColor"/>
                </svg>
                Ver Catálogo
            </a>
        </div>
    </div>

</body>
</html>
