<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Componentes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50 p-8">
    <div class="max-w-7xl mx-auto">
        <div class="text-center mb-10">
            <h2 class="text-5xl font-bold text-blue-700 mb-2">Catálogo de Componentes</h2>
            <p class="text-blue-500 text-xl">¡Descubre todos los componentes de una computadora! 🔍</p>
            <div class="inline-block bg-blue-600 text-white px-6 py-2 rounded-full mt-4 font-bold">Explorados: 0 / 12</div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="bg-white rounded-3xl p-5 border-2 border-blue-400 card-shadow scale-105">
                <div class="relative mb-4">
                    <img src="https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?w=300" class="rounded-2xl w-full h-40 object-cover">
                    <span class="absolute bottom-2 right-2 text-2xl">🧠</span>
                </div>
                <h3 class="text-blue-600 text-2xl font-bold text-center mb-2">Procesador</h3>
                <p class="text-gray-500 text-sm text-center mb-4">¡Es el cerebro de la computadora! Piensa y toma decisiones.</p>
                <div class="bg-blue-500 text-white p-2 rounded-xl text-xs flex items-center gap-2 mb-4">
                    <span>🧠</span> Como el cerebro que piensa
                </div>
                <button class="w-full bg-blue-600 text-white py-2 rounded-xl font-bold">ⓘ Ver Detalles</button>
            </div>
            </div>

        <div class="text-center mt-12">
            <a href="index.html" class="text-blue-600 font-bold hover:underline">← Volver al Menú Principal</a>
        </div>
    </div>
</body>
</html>
