<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Ensamble - Arquikids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f0f4f9; }
        .card-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.05); }
        .component-btn { transition: all 0.2s; border: 2px solid transparent; }
        .component-btn:hover { transform: scale(1.05); }
        .component-active { border-color: #facc15; background-color: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-4 md:p-6">

    <div class="max-w-[1400px] mx-auto mb-6 bg-white rounded-3xl p-3 flex items-center justify-between card-shadow border border-gray-100">
        <a href="menu.html" class="bg-blue-900 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2">
            ← Menú Principal
        </a>
        
        <div class="flex items-center gap-2 text-blue-700 font-bold">
            <span>🔧</span>
            <span>Simulador de Ensamble</span>
        </div>

        <div class="flex items-center gap-4">
            <div class="bg-yellow-400 bg-opacity-20 text-yellow-600 px-4 py-1 rounded-full font-bold flex items-center gap-1">
                ⭐ 0 pts
            </div>
            <div class="bg-blue-100 p-1 rounded-full border-2 border-white shadow-sm">
                <img src="https://img.icons8.com/bubbles/100/000000/robot.png" class="w-10 h-10">
            </div>
        </div>
    </div>

    <div class="max-w-[1400px] mx-auto grid grid-cols-12 gap-6">
        <div class="col-span-12 lg:col-span-4 flex flex-col gap-6">
            <div class="bg-blue-600 rounded-[2.5rem] p-8 text-white shadow-xl">
                <div class="flex items-center gap-4 mb-6">
                    <div class="bg-white text-blue-600 w-10 h-10 rounded-full flex items-center justify-center font-bold text-xl">2</div>
                    <h2 class="text-2xl font-bold">Paso 2 de 4</h2>
                </div>
                <div class="bg-blue-500 bg-opacity-40 p-6 rounded-3xl mb-6">
                    <p class="text-lg leading-snug">Ahora coloca el <b>Procesador (CPU)</b> en su ranura especial de la tarjeta madre.</p>
                </div>
                <div class="flex gap-2">
                    <div class="h-2 flex-1 bg-green-400 rounded-full"></div>
                    <div class="h-2 flex-1 bg-white rounded-full"></div>
                    <div class="h-2 flex-1 bg-blue-400 opacity-30 rounded-full"></div>
                    <div class="h-2 flex-1 bg-blue-400 opacity-30 rounded-full"></div>
                </div>
            </div>

            <div class="bg-blue-500 rounded-[2.5rem] p-8 text-white shadow-xl">
                <h3 class="text-center text-2xl font-bold mb-6">Componentes</h3>
                <div class="grid grid-cols-2 gap-4">
                    <button class="component-btn bg-white bg-opacity-10 p-4 rounded-2xl flex flex-col items-center opacity-50">
                        <div class="h-16 flex items-center justify-center text-4xl">🏗️</div>
                        <p class="text-xs font-bold mt-2">Tarjeta Madre</p>
                    </button>
                    <button class="component-btn bg-white bg-opacity-20 p-4 rounded-2xl flex flex-col items-center component-active">
                        <div class="h-16 flex items-center justify-center text-4xl">🧠</div>
                        <p class="text-xs font-bold mt-2">Procesador</p>
                    </button>
                    <button class="component-btn bg-white bg-opacity-10 p-4 rounded-2xl flex flex-col items-center opacity-50">
                        <div class="h-16 flex items-center justify-center text-4xl">💾</div>
                        <p class="text-xs font-bold mt-2">Memoria RAM</p>
                    </button>
                    <button class="component-btn bg-white bg-opacity-10 p-4 rounded-2xl flex flex-col items-center opacity-50">
                        <div class="h-16 flex items-center justify-center text-4xl">🎨</div>
                        <p class="text-xs font-bold mt-2">Tarjeta Gráfica</p>
                    </button>
                </div>
            </div>
        </div>

        <div class="col-span-12 lg:col-span-8 flex flex-col gap-4">
            <div class="flex justify-end gap-3">
                <button class="bg-yellow-400 text-blue-900 px-6 py-2 rounded-xl font-bold shadow-md flex items-center gap-2">💡 Ver Pista</button>
                <button onclick="location.reload()" class="bg-blue-900 text-white px-6 py-2 rounded-xl font-bold shadow-md flex items-center gap-2">🔄 Reiniciar</button>
                <button onclick="guardarAvance(100)" class="bg-green-500 text-white px-6 py-2 rounded-xl font-bold shadow-md flex items-center gap-2 hover:bg-green-600 transition-all transform hover:scale-105">💾 Guardar Avance</button>
            </div>

            <div class="bg-white rounded-[3rem] p-4 flex-1 shadow-2xl border-4 border-blue-50 flex flex-col">
                <h2 class="text-blue-700 text-3xl font-bold text-center py-4">Gabinete de la Computadora</h2>
                <div id="canvas-3d" class="flex-1 bg-slate-50 rounded-[2.5rem] overflow-hidden relative">
                    <div class="absolute top-4 left-4 text-gray-300 text-xs font-bold pointer-events-none uppercase">Área de ensamble 3D</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. CRONÓMETRO: Empezar a contar al cargar
        let tiempoInicio = Date.now();

        // 2. LÓGICA 3D (Tus gráficos originales)
        let scene, camera, renderer, controls;
        const container = document.getElementById('canvas-3d');

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8fafc);
            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(2, 2, 4);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);

            const light = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(light);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(5, 10, 5);
            scene.add(dirLight);

            // Placa Base (Verde)
            const moboGeom = new THREE.BoxGeometry(3, 0.1, 2);
            const moboMat = new THREE.MeshPhongMaterial({ color: 0x22c55e });
            scene.add(new THREE.Mesh(moboGeom, moboMat));

            // CPU (Gris)
            const cpuGeom = new THREE.BoxGeometry(0.5, 0.15, 0.5);
            const cpuMat = new THREE.MeshPhongMaterial({ color: 0x94a3b8 });
            const cpu = new THREE.Mesh(cpuGeom, cpuMat);
            cpu.position.y = 0.5;
            scene.add(cpu);

            function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
            animate();
        }

        // 3. LÓGICA DE TIEMPO (Reparada)
        function tiempoASegundos(tStr) {
            if (!tStr || tStr === "--") return 999999;
            const partes = tStr.split(':');
            return (parseInt(partes[0]) * 60) + parseInt(partes[1]);
        }

        function guardarAvance(puntosGanados) {
            const ahora = Date.now();
            const segundosTotales = Math.floor((ahora - tiempoInicio) / 1000);
            
            const min = Math.floor(segundosTotales / 60);
            const seg = segundosTotales % 60;
            const tiempoActualStr = `${min.toString().padStart(2, '0')}:${seg.toString().padStart(2, '0')}`;

            let perfil = JSON.parse(localStorage.getItem('perfilActivo'));

            if (perfil) {
                perfil.puntos = (perfil.puntos || 0) + puntosGanados;
                perfil.ensambles = (perfil.ensambles || 0) + 1;
                perfil.logros = (perfil.logros || 0) + 1;

                // --- LÓGICA DE COMPARACIÓN ---
                // Si quieres mostrar el TIEMPO MÁS LARGO (el mayor): usa >
                // Si quieres mostrar el TIEMPO MÁS RÁPIDO (el récord): usa <
                const tiempoGuardadoSegundos = tiempoASegundos(perfil.mejorTiempo);
                
                if (perfil.mejorTiempo === "--" || segundosTotales > tiempoGuardadoSegundos) {
                    perfil.mejorTiempo = tiempoActualStr;
                    console.log("Nuevo tiempo máximo guardado:", tiempoActualStr);
                }

                // GUARDADO CRÍTICO: Debes actualizar ambos para que el menú lo vea
                localStorage.setItem('perfilActivo', JSON.stringify(perfil));
                localStorage.setItem(`perfil_${perfil.nombre}`, JSON.stringify(perfil));

                alert(`¡Avance guardado! Tiempo de esta partida: ${tiempoActualStr}`);
                window.location.href = "menu.html"; 
            }
        }

        window.addEventListener('load', () => {
            init3D();
            const perfil = JSON.parse(localStorage.getItem('perfilActivo'));
            if (perfil) {
                document.querySelector('.bg-yellow-400.bg-opacity-20').innerHTML = `⭐ ${perfil.puntos || 0} pts`;
                if (perfil.avatar) document.querySelector('.bg-blue-100 img').src = perfil.avatar;
            }
        });
    </script>
</body>
</html>
