<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Ensamble - Arquikids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f0f4f9; }
        .card-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.05); }
        #canvas-3d { cursor: grab; }
        #canvas-3d:active { cursor: grabbing; }
    </style>
</head>
<body class="p-4 md:p-6">

    <div class="max-w-[1400px] mx-auto mb-6 bg-white rounded-3xl p-3 flex items-center justify-between card-shadow border border-gray-100">
        <a href="menu.html" class="bg-blue-900 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2">
            ← Menú Principal
        </a>
        <div class="flex items-center gap-2 text-blue-700 font-bold">
            <span>🔧</span>
            <span>Simulador de Ensamble</span>
        </div>
        <div class="flex items-center gap-4">
            <div id="badge-puntos" class="bg-yellow-400 bg-opacity-20 text-yellow-600 px-4 py-1 rounded-full font-bold flex items-center gap-1" style="transition:transform 0.2s;">⭐ <span id="puntos-display">0</span> pts</div>
            <div class="bg-blue-100 p-1 rounded-full border-2 border-white shadow-sm">
                <img src="https://img.icons8.com/bubbles/100/000000/robot.png" class="w-10 h-10">
            </div>
        </div>
    </div>

    <div class="max-w-[1400px] mx-auto grid grid-cols-12 gap-6">
        <div class="col-span-12 lg:col-span-4 flex flex-col gap-6">
            <div class="bg-blue-600 rounded-[2.5rem] p-8 text-white shadow-xl">
                <div class="flex items-center gap-4 mb-6">
                    <div id="paso-num" class="bg-white text-blue-600 w-10 h-10 rounded-full flex items-center justify-center font-bold text-xl">1</div>
                    <h2 id="paso-titulo" class="text-2xl font-bold">Paso 1 de 5</h2>
                </div>
                <div class="bg-blue-500 bg-opacity-40 p-6 rounded-3xl mb-5">
                    <p id="paso-desc" class="text-lg leading-snug">¡Empieza colocando el <strong>Procesador (CPU) 🧠</strong> en su lugar de la placa base!</p>
                </div>
                <!-- Barra de progreso -->
                <div>
                    <div class="flex justify-between text-sm font-bold mb-2" style="opacity:0.9;">
                        <span>Progreso de ensamble</span>
                        <span id="paso-fraccion">0 / 5</span>
                    </div>
                    <div class="rounded-full overflow-hidden" style="background:rgba(255,255,255,0.2);height:18px;">
                        <div id="barra-avance" style="height:18px;width:0%;background:linear-gradient(90deg,#4ade80,#22c55e);border-radius:999px;transition:width 0.7s cubic-bezier(.4,0,.2,1);"></div>
                    </div>
                    <div id="chips-completados" class="flex flex-wrap gap-2 mt-3 min-h-[28px]"></div>
                </div>
            </div>

            <div class="bg-blue-500 rounded-[2.5rem] p-8 text-white shadow-xl">
                <h3 class="text-center text-2xl font-bold mb-6">Componentes</h3>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="abrirModal('cpu')"           id="btn-cpu"           class="comp-btn bg-white bg-opacity-20 p-4 rounded-2xl flex flex-col items-center hover:bg-opacity-30 transition-all cursor-pointer border-0">
                        <div class="h-12 text-4xl">🧠</div><p class="text-xs font-bold mt-2">Procesador</p>
                    </button>
                    <button onclick="abrirModal('ram')"           id="btn-ram"           class="comp-btn bg-white bg-opacity-20 p-4 rounded-2xl flex flex-col items-center hover:bg-opacity-30 transition-all cursor-pointer border-0">
                        <div class="h-12 text-4xl">💾</div><p class="text-xs font-bold mt-2">Memoria RAM</p>
                    </button>
                    <button onclick="abrirModal('gpu')"           id="btn-gpu"           class="comp-btn bg-white bg-opacity-20 p-4 rounded-2xl flex flex-col items-center hover:bg-opacity-30 transition-all cursor-pointer border-0">
                        <div class="h-12 text-4xl">🎨</div><p class="text-xs font-bold mt-2">Tarjeta Gráfica</p>
                    </button>
                    <button onclick="abrirModal('disco_duro')"    id="btn-disco_duro"    class="comp-btn bg-white bg-opacity-20 p-4 rounded-2xl flex flex-col items-center hover:bg-opacity-30 transition-all cursor-pointer border-0">
                        <div class="h-12 text-4xl">💿</div><p class="text-xs font-bold mt-2">Disco Duro</p>
                    </button>
                    <button onclick="abrirModal('psu')"           id="btn-psu"           class="comp-btn bg-white bg-opacity-20 p-4 rounded-2xl flex flex-col items-center hover:bg-opacity-30 transition-all cursor-pointer border-0">
                        <div class="h-12 text-4xl">🔋</div><p class="text-xs font-bold mt-2">Fuente de Poder</p>
                    </button>
                    <button onclick="abrirModal('refrigeracion')" id="btn-refrigeracion" class="comp-btn bg-white bg-opacity-20 p-4 rounded-2xl flex flex-col items-center hover:bg-opacity-30 transition-all cursor-pointer border-0">
                        <div class="h-12 text-4xl">❄️</div><p class="text-xs font-bold mt-2">Refrigeración</p>
                    </button>
                    <button onclick="abrirModal('monitor')"       id="btn-monitor"       class="comp-btn bg-white bg-opacity-20 p-4 rounded-2xl flex flex-col items-center hover:bg-opacity-30 transition-all cursor-pointer border-0">
                        <div class="h-12 text-4xl">🖥️</div><p class="text-xs font-bold mt-2">Monitor</p>
                    </button>
                    <button onclick="abrirModal('mouse')"         id="btn-mouse"         class="comp-btn bg-white bg-opacity-20 p-4 rounded-2xl flex flex-col items-center hover:bg-opacity-30 transition-all cursor-pointer border-0">
                        <div class="h-12 text-4xl">🖱️</div><p class="text-xs font-bold mt-2">Mouse</p>
                    </button>
                </div>
            </div>
        </div>

        <div class="col-span-12 lg:col-span-8 flex flex-col gap-4">
            <div class="flex justify-end gap-3">
                <button onclick="location.reload()" class="bg-blue-900 text-white px-6 py-2 rounded-xl font-bold shadow-md">🔄 Reiniciar</button>
                <button onclick="guardarAvance(100)" class="bg-green-500 text-white px-6 py-2 rounded-xl font-bold shadow-md">💾 Guardar Avance</button>
            </div>
            <div class="bg-white rounded-[3rem] p-4 flex-1 shadow-2xl border-4 border-blue-50 flex flex-col">
                <h2 class="text-blue-700 text-3xl font-bold text-center py-4">Mesa de Trabajo</h2>
                <div id="canvas-3d" class="flex-1 bg-slate-50 rounded-[2.5rem] overflow-hidden relative" style="min-height: 480px;">
                    <div id="debug-panel" style="position:absolute;top:16px;left:16px;z-index:10;background:rgba(0,0,0,0.75);color:#4ade80;font-family:monospace;font-size:13px;padding:10px 14px;border-radius:10px;pointer-events:none;line-height:1.8;">
                        <div style="color:white;font-weight:bold;margin-bottom:4px;">🔍 DEBUG — Posición</div>
                        <div>Pieza: <span id="dbg-nombre" style="color:#facc15">—</span></div>
                        <div>X: <span id="dbg-x">—</span></div>
                        <div>Y: <span id="dbg-y">—</span></div>
                        <div>Z: <span id="dbg-z">—</span></div>
                    </div>
                    <div id="rot-buttons" style="display:none;position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;gap:10px;flex-direction:row;">
                        <button onclick="rotarSeleccionado('x')" style="background:#1d4ed8;color:white;border:none;padding:8px 18px;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer;">↕ Rotar X</button>
                        <button onclick="rotarSeleccionado('y')" style="background:#1d4ed8;color:white;border:none;padding:8px 18px;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer;">↔ Rotar Y</button>
                        <button onclick="rotarSeleccionado('z')" style="background:#1d4ed8;color:white;border:none;padding:8px 18px;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer;">🔄 Rotar Z</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" style="display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;">
        <div style="background:white;border-radius:2rem;padding:2.5rem;max-width:420px;width:90%;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,0.3);">
            <div id="modal-emoji" style="font-size:4rem;margin-bottom:1rem;"></div>
            <h2 id="modal-titulo" style="font-size:1.8rem;font-weight:800;color:#1e40af;margin-bottom:0.75rem;"></h2>
            <p id="modal-desc" style="font-size:1rem;color:#374151;line-height:1.6;margin-bottom:0.5rem;"></p>
            <p id="modal-fun" style="font-size:0.9rem;color:#6b7280;font-style:italic;margin-bottom:1.5rem;"></p>
            <button onclick="cerrarModal()" style="background:#2563eb;color:white;border:none;padding:0.75rem 2.5rem;border-radius:1rem;font-size:1rem;font-weight:700;cursor:pointer;">¡Listo, a colocarlo! 🚀</button>
        </div>
    </div>

    <script>
    // ── Zonas correctas + tolerancia ────────────────────────────────────────
    // posCorrecta: coordenadas que mediste con el debug
    // tolerancia: radio en unidades 3D (ajusta si quieres más/menos margen)
    const ZONAS = {
        cpu:          { x: 14.508,  y: 4.006,  z: -38.441,  tolerancia: 8 },
        ram:          { x: 67.217,  y: 21.323, z: -39.215,  tolerancia: 8 },
        gpu:          { x: -2.188,  y: 27.696, z: 58.684,   tolerancia: 8 },
        disco_duro:   { x: 3.334,   y: 7.959,  z: -86.261,  tolerancia: 8 },
        psu:          { x: 84.159,  y: 59.328, z: -91.745,  tolerancia: 8 },
        // Sin coordenadas aún — no valida (pon las tuyas cuando las midas)
        refrigeracion:null,
        monitor:      null,
        mouse:        null,
    };

    const COMPONENTES = {
 cpu:          { nombre:'Procesador (CPU)',      emoji:'🧠', desc:'Es el cerebro de la computadora. Procesa todas las instrucciones del sistema.',           fun:'💡 ¡Un procesador moderno puede hacer billones de operaciones por segundo!', modelo:'../assets/models/cpu.glb',          escala:0.05,  posInicial:{x:0,y:0,z:0} },
        ram:          { nombre:'Memoria RAM',           emoji:'💾', desc:'Guarda temporalmente los programas abiertos para que el procesador los use rápido.',      fun:'💡 RAM significa "Random Access Memory" o Memoria de Acceso Aleatorio.',     modelo:'../assets/models/ram.glb',          escala:930,   posInicial:{x:0,y:0,z:0} },
        gpu:          { nombre:'Tarjeta Gráfica (GPU)', emoji:'🎨', desc:'Procesa y muestra las imágenes en pantalla. Clave para videojuegos y diseño.',            fun:'💡 Las GPU también se usan para entrenar inteligencia artificial.',           modelo:'../assets/models/gpu.glb',          escala:0.35,  posInicial:{x:0,y:0,z:0} },
        disco_duro:   { nombre:'Disco Duro',            emoji:'💿', desc:'Guarda todos tus archivos y el sistema operativo de forma permanente.',                    fun:'💡 Los SSD son mucho más rápidos que los discos tradicionales.',              modelo:'../assets/models/disco_duro.glb',   escala:0.7,  posInicial:{x:0,y:0,z:0} },
        psu:          { nombre:'Fuente de Poder (PSU)', emoji:'🔋', desc:'Convierte la electricidad de la pared en energía para todos los componentes.',            fun:'💡 Una buena fuente puede hacer que tu PC dure muchos más años.',            modelo:'../assets/models/psu.glb',          escala:3,  posInicial:{x:0,y:0,z:0} },
        refrigeracion:{ nombre:'Refrigeración',         emoji:'❄️', desc:'Mantiene fríos al procesador y componentes para que no se dañen por el calor.',           fun:'💡 Algunos gamers usan refrigeración con agua para enfriar sus PCs.',        modelo:'../assets/models/refrigeracion.glb', escala:20, posInicial:{x:0,y:0,z:0} },
        monitor:      { nombre:'Monitor',               emoji:'🖥️', desc:'La pantalla donde ves todo lo que hace la computadora.',                                  fun:'💡 Los monitores gaming muestran hasta 360 imágenes por segundo.',           modelo:'../assets/models/monitor.glb',      escala:8,  posInicial:{x:0,y:0,z:0} },
        mouse:        { nombre:'Mouse',                 emoji:'🖱️', desc:'Dispositivo para mover el cursor y hacer clic. Una de las formas de controlar la PC.',   fun:'💡 El primer mouse fue inventado en 1964 y era de madera.',                  modelo:'../assets/models/mouse.glb',        escala:10,  posInicial:{x:0,y:0,z:0} },
    };

    let scene, camera, renderer, orbitControls;
    let grupos = [];
    let isDragging = false;
    let selectedGroup = null;
    let ultimoSeleccionado = null;
    let dragPlane  = new THREE.Plane();
    let dragOffset = new THREE.Vector3();
    let raycaster  = new THREE.Raycaster();
    let mouse      = new THREE.Vector2();
    let intersectPoint = new THREE.Vector3();
    let meshToGroup    = new Map();
    let grupoNombre    = new Map();
    let grupoClave     = new Map(); // grupo → clave del componente (para validar)
    let componentePendiente = null;
    const container = document.getElementById('canvas-3d');

    // ── Puntos y progreso ────────────────────────────────────────────────────
    let puntos = 0;
    const colocadosOk = new Set(); // claves ya colocadas correctamente

    // Componentes que tienen zona definida, en orden (cpu siempre primero)
    const ORDEN_VALIDABLES = ['cpu','ram','gpu','disco_duro','psu'];
    const TOTAL = ORDEN_VALIDABLES.length;

    function siguienteSugerido() {
        for (const k of ORDEN_VALIDABLES) {
            if (!colocadosOk.has(k)) return k;
        }
        return null;
    }

    function actualizarUI() {
        const n = colocadosOk.size;
        const pct = TOTAL > 0 ? (n / TOTAL) * 100 : 0;

        // Puntos
        document.getElementById('puntos-display').textContent = puntos;

        // Barra
        document.getElementById('barra-avance').style.width = pct + '%';
        document.getElementById('paso-fraccion').textContent = n + ' / ' + TOTAL;

        // Chips
        const chips = document.getElementById('chips-completados');
        chips.innerHTML = '';
        colocadosOk.forEach(k => {
            const c = COMPONENTES[k];
            const s = document.createElement('span');
            s.style.cssText = 'background:rgba(255,255,255,0.22);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:700;';
            s.textContent = (c.emoji||'') + ' ✓';
            chips.appendChild(s);
        });

        // Paso
        const sig = siguienteSugerido();
        if (sig) {
            const c = COMPONENTES[sig];
            const num = n + 1;
            document.getElementById('paso-num').textContent  = num;
            document.getElementById('paso-titulo').textContent = 'Paso ' + num + ' de ' + TOTAL;
            document.getElementById('paso-desc').innerHTML =
                'Coloca el <strong>' + c.nombre + ' ' + c.emoji + '</strong> en su lugar correcto de la placa base. ¡Arrástralo y encájalo!';
        } else {
            document.getElementById('paso-num').textContent   = '🎉';
            document.getElementById('paso-titulo').textContent = '¡Todo listo!';
            document.getElementById('paso-desc').innerHTML    = '¡Felicidades! Ensamblaste todos los componentes correctamente. <strong>¡Eres un pro! 🚀</strong>';
        }
    }

    // ── Modal ────────────────────────────────────────────────────────────────
    function abrirModal(clave) {
        const c = COMPONENTES[clave];
        if (!c) return;
        componentePendiente = clave;
        document.getElementById('modal-emoji').textContent  = c.emoji;
        document.getElementById('modal-titulo').textContent = c.nombre;
        document.getElementById('modal-desc').textContent   = c.desc;
        document.getElementById('modal-fun').textContent    = c.fun;
        document.getElementById('modal').style.display = 'flex';
    }

    function cerrarModal() {
        document.getElementById('modal').style.display = 'none';
        if (!componentePendiente) return;
        const c = COMPONENTES[componentePendiente];
        cargarComponente(c.modelo, c.escala, c.posInicial, c.nombre, c.emoji, componentePendiente);
        const btn = document.getElementById('btn-' + componentePendiente);
        if (btn) { btn.style.background = 'rgba(74,222,128,0.35)'; btn.style.pointerEvents = 'none'; btn.style.opacity = '0.7'; }
        componentePendiente = null;
    }

    // ── Rotación ─────────────────────────────────────────────────────────────
    function rotarSeleccionado(eje) {
        if (!ultimoSeleccionado) return;
        const a = Math.PI / 2;
        if (eje === 'x') ultimoSeleccionado.rotation.x += a;
        if (eje === 'y') ultimoSeleccionado.rotation.y += a;
        if (eje === 'z') ultimoSeleccionado.rotation.z += a;
    }

    // ── Validación de posición ────────────────────────────────────────────────
    function validarPosicion(grupo) {
        const clave = grupoClave.get(grupo);
        const zona  = clave ? ZONAS[clave] : null;
        if (!zona) return;

        const p    = grupo.position;
        const dist = Math.sqrt(
            Math.pow(p.x - zona.x, 2) +
            Math.pow(p.y - zona.y, 2) +
            Math.pow(p.z - zona.z, 2)
        );
        const correcto = dist <= zona.tolerancia;

        // Colorear todos los meshes del grupo
        grupo.traverse(obj => {
            if (!obj.isMesh) return;
            if (!obj.userData.matOriginal) {
                obj.userData.matOriginal = obj.material;
            }
            if (correcto) {
                obj.material = new THREE.MeshStandardMaterial({ color: 0x22c55e, transparent: true, opacity: 0.85 });
            } else {
                obj.material = new THREE.MeshStandardMaterial({ color: 0xef4444, transparent: true, opacity: 0.85 });
            }
        });

        // Sumar 100 pts la primera vez que se coloca bien
        if (correcto && !colocadosOk.has(clave)) {
            colocadosOk.add(clave);
            puntos += 100;
            // Animación pop en el badge
            const badge = document.getElementById('badge-puntos');
            badge.style.transform = 'scale(1.35)';
            setTimeout(() => { badge.style.transform = 'scale(1)'; }, 300);
            actualizarUI();
        }
    }

    function restaurarMaterial(grupo) {
        grupo.traverse(obj => {
            if (obj.isMesh && obj.userData.matOriginal) {
                obj.material = obj.userData.matOriginal;
            }
        });
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    function init3D() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 20, 40);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);
        orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5);
        scene.add(light);
        cargarFijo('../assets/models/placa_base.glb', 50, {x:0,y:0,z:0});
        renderer.domElement.addEventListener('pointerdown', onPointerDown);
        renderer.domElement.addEventListener('pointermove', onPointerMove);
        renderer.domElement.addEventListener('pointerup',   onPointerUp);
        animate();
    }

    function cargarFijo(ruta, escala, pos) {
        const loader = new THREE.GLTFLoader();
        loader.load(ruta, function(gltf) {
            const g = new THREE.Group();
            g.add(gltf.scene);
            g.scale.set(escala, escala, escala);
            g.position.set(pos.x, pos.y, pos.z);
            scene.add(g);
        }, undefined, (e) => console.error('Error placa_base:', e));
    }

    function cargarComponente(ruta, escala, pos, nombre, emoji, clave) {
        const loader = new THREE.GLTFLoader();
        loader.load(ruta, function(gltf) {
            const g = new THREE.Group();
            g.add(gltf.scene);
            g.scale.set(escala, escala, escala);
            g.position.set(pos.x, pos.y, pos.z);
            scene.add(g);
            grupos.push(g);
            grupoNombre.set(g, (emoji||'') + ' ' + (nombre||''));
            grupoClave.set(g, clave);
            g.traverse(obj => { if (obj.isMesh) meshToGroup.set(obj.uuid, g); });
        }, undefined, (e) => console.error('Error:', ruta, e));
    }

    // ── Arrastre ──────────────────────────────────────────────────────────────
    function getMouseNDC(e) {
        const r = renderer.domElement.getBoundingClientRect();
        mouse.x =  ((e.clientX - r.left) / r.width)  * 2 - 1;
        mouse.y = -((e.clientY - r.top)  / r.height) * 2 + 1;
    }

    function onPointerDown(e) {
        getMouseNDC(e);
        raycaster.setFromCamera(mouse, camera);
        const meshes = [];
        grupos.forEach(g => g.traverse(o => { if (o.isMesh) meshes.push(o); }));
        const hits = raycaster.intersectObjects(meshes, false);
        if (!hits.length) return;
        selectedGroup = meshToGroup.get(hits[0].object.uuid);
        if (!selectedGroup) return;
        ultimoSeleccionado = selectedGroup;
        // Al empezar a arrastrar, restaurar color original
        restaurarMaterial(selectedGroup);
        isDragging = true;
        orbitControls.enabled = false;
        renderer.domElement.style.cursor = 'grabbing';
        document.getElementById('rot-buttons').style.display = 'flex';
        dragPlane.setFromNormalAndCoplanarPoint(
            camera.getWorldDirection(new THREE.Vector3()).negate(),
            selectedGroup.position
        );
        raycaster.ray.intersectPlane(dragPlane, intersectPoint);
        dragOffset.copy(intersectPoint).sub(selectedGroup.position);
    }

    function onPointerMove(e) {
        if (!isDragging || !selectedGroup) return;
        getMouseNDC(e);
        raycaster.setFromCamera(mouse, camera);
        if (raycaster.ray.intersectPlane(dragPlane, intersectPoint)) {
            selectedGroup.position.copy(intersectPoint.sub(dragOffset));
            const p = selectedGroup.position;
            document.getElementById('dbg-nombre').textContent = grupoNombre.get(selectedGroup) || '?';
            document.getElementById('dbg-x').textContent = p.x.toFixed(3);
            document.getElementById('dbg-y').textContent = p.y.toFixed(3);
            document.getElementById('dbg-z').textContent = p.z.toFixed(3);
        }
    }

    function onPointerUp() {
        if (selectedGroup) {
            const p = selectedGroup.position;
            document.getElementById('dbg-nombre').textContent = grupoNombre.get(selectedGroup) || '?';
            document.getElementById('dbg-x').textContent = p.x.toFixed(3);
            document.getElementById('dbg-y').textContent = p.y.toFixed(3);
            document.getElementById('dbg-z').textContent = p.z.toFixed(3);
            // Validar posición al soltar
            validarPosicion(selectedGroup);
        }
        isDragging = false;
        selectedGroup = null;
        orbitControls.enabled = true;
        renderer.domElement.style.cursor = 'grab';
    }

    function animate() {
        requestAnimationFrame(animate);
        if (orbitControls) orbitControls.update();
        if (renderer && scene && camera) renderer.render(scene, camera);
    }

    window.addEventListener('load', () => { init3D(); actualizarUI(); });
    window.addEventListener('resize', () => {
        if (!camera || !renderer) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
    </script>
</body>
</html>
