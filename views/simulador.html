<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Ensamble - Arquikids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f0f4f9; }
        .card-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.05); }
        #canvas-3d { cursor: grab; }
        #canvas-3d:active { cursor: grabbing; }
    </style>
</head>
<body class="p-4 md:p-6">

    <div class="max-w-[1400px] mx-auto mb-6 bg-white rounded-3xl p-3 flex items-center justify-between card-shadow border border-gray-100">
        <a href="menu.html" class="bg-blue-900 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2">
            ← Menú Principal
        </a>
        <div class="flex items-center gap-2 text-blue-700 font-bold">
            <span>🔧</span>
            <span>Simulador de Ensamble</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="bg-yellow-400 bg-opacity-20 text-yellow-600 px-4 py-1 rounded-full font-bold flex items-center gap-1">⭐ 0 pts</div>
            <div class="bg-blue-100 p-1 rounded-full border-2 border-white shadow-sm">
                <img src="https://img.icons8.com/bubbles/100/000000/robot.png" class="w-10 h-10">
            </div>
        </div>
    </div>

    <div class="max-w-[1400px] mx-auto grid grid-cols-12 gap-6">
        <div class="col-span-12 lg:col-span-4 flex flex-col gap-6">
            <div class="bg-blue-600 rounded-[2.5rem] p-8 text-white shadow-xl">
                <div class="flex items-center gap-4 mb-6">
                    <div class="bg-white text-blue-600 w-10 h-10 rounded-full flex items-center justify-center font-bold text-xl">2</div>
                    <h2 class="text-2xl font-bold">Paso 2 de 4</h2>
                </div>
                <div class="bg-blue-500 bg-opacity-40 p-6 rounded-3xl mb-6">
                    <p class="text-lg leading-snug">¡Ahora sí! Arrastra cualquier pieza, suéltala y elige otra. ¡Todas son movibles!</p>
                </div>
            </div>

            <div class="bg-blue-500 rounded-[2.5rem] p-8 text-white shadow-xl">
                <h3 class="text-center text-2xl font-bold mb-6">Componentes</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white bg-opacity-20 p-4 rounded-2xl flex flex-col items-center"><div class="h-16 text-4xl">🏗️</div><p class="text-xs font-bold mt-2">Tarjeta Madre</p></div>
                    <div class="bg-white bg-opacity-20 p-4 rounded-2xl flex flex-col items-center"><div class="h-16 text-4xl">🧠</div><p class="text-xs font-bold mt-2">Procesador</p></div>
                    <div class="bg-white bg-opacity-20 p-4 rounded-2xl flex flex-col items-center"><div class="h-16 text-4xl">💾</div><p class="text-xs font-bold mt-2">Memoria RAM</p></div>
                    <div class="bg-white bg-opacity-20 p-4 rounded-2xl flex flex-col items-center"><div class="h-16 text-4xl">🎨</div><p class="text-xs font-bold mt-2">Tarjeta Gráfica</p></div>
                </div>
            </div>
        </div>

        <div class="col-span-12 lg:col-span-8 flex flex-col gap-4">
            <div class="flex justify-end gap-3">
                <button onclick="location.reload()" class="bg-blue-900 text-white px-6 py-2 rounded-xl font-bold shadow-md">🔄 Reiniciar</button>
                <button onclick="guardarAvance(100)" class="bg-green-500 text-white px-6 py-2 rounded-xl font-bold shadow-md">💾 Guardar Avance</button>
            </div>
            <div class="bg-white rounded-[3rem] p-4 flex-1 shadow-2xl border-4 border-blue-50 flex flex-col">
                <h2 class="text-blue-700 text-3xl font-bold text-center py-4">Mesa de Trabajo</h2>
                <div id="canvas-3d" class="flex-1 bg-slate-50 rounded-[2.5rem] overflow-hidden relative" style="min-height: 480px;"></div>
            </div>
        </div>
    </div>

    <script>
    let scene, camera, renderer, orbitControls;
    // Cada grupo que se pueda arrastrar
    let grupos = [];

    // Estado del arrastre manual
    let isDragging = false;
    let selectedGroup = null;
    let dragPlane = new THREE.Plane();
    let dragOffset = new THREE.Vector3();
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let intersectPoint = new THREE.Vector3();

    // Para detectar qué mesh pertenece a qué grupo
    let meshToGroup = new Map();

    const container = document.getElementById('canvas-3d');

    function init3D() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(5, 5, 12);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5);
        scene.add(light);

        // Carga de piezas con posiciones separadas
        cargarComponente('../assets/models/motherboard.glb', 0.15, { x: 0,  y: -1, z: 0 });
        cargarComponente('../assets/models/cpu.glb',         0.05, { x: -5, y: 0,  z: 0 });
        cargarComponente('../assets/models/ram.glb',         0.1,  { x: 5,  y: 0,  z: 0 });
        cargarComponente('../assets/models/gpu.glb',         0.01, { x: 0,  y: 0,  z: 5 });

        // Eventos de arrastre manual
        renderer.domElement.addEventListener('pointerdown', onPointerDown);
        renderer.domElement.addEventListener('pointermove', onPointerMove);
        renderer.domElement.addEventListener('pointerup',   onPointerUp);

        animate();
    }

    function cargarComponente(ruta, escala, posicion) {
        const loader = new THREE.GLTFLoader();
        loader.load(ruta, function (gltf) {
            const grupo = new THREE.Group();
            grupo.add(gltf.scene);
            grupo.scale.set(escala, escala, escala);
            grupo.position.set(posicion.x, posicion.y, posicion.z);
            scene.add(grupo);
            grupos.push(grupo);

            // Mapeamos todos los meshes del grupo a su grupo padre
            grupo.traverse(obj => {
                if (obj.isMesh) {
                    meshToGroup.set(obj.uuid, grupo);
                }
            });

        }, undefined, (error) => console.error("Error cargando:", ruta, error));
    }

    // ---- Lógica de arrastre manual ----

    function getMouseNDC(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x =  ((event.clientX - rect.left) / rect.width)  * 2 - 1;
        mouse.y = -((event.clientY - rect.top)  / rect.height) * 2 + 1;
    }

    function onPointerDown(event) {
        getMouseNDC(event);
        raycaster.setFromCamera(mouse, camera);

        // Recolectamos todos los meshes de todos los grupos
        const allMeshes = [];
        grupos.forEach(g => g.traverse(obj => { if (obj.isMesh) allMeshes.push(obj); }));

        const hits = raycaster.intersectObjects(allMeshes, false);
        if (hits.length === 0) return;

        const hitMesh = hits[0].object;
        selectedGroup = meshToGroup.get(hitMesh.uuid);
        if (!selectedGroup) return;

        isDragging = true;
        orbitControls.enabled = false;
        renderer.domElement.style.cursor = 'grabbing';

        // Plano de arrastre horizontal en la altura actual del grupo
        dragPlane.setFromNormalAndCoplanarPoint(
            camera.getWorldDirection(new THREE.Vector3()).negate(),
            selectedGroup.position
        );

        raycaster.ray.intersectPlane(dragPlane, intersectPoint);
        dragOffset.copy(intersectPoint).sub(selectedGroup.position);
    }

    function onPointerMove(event) {
        if (!isDragging || !selectedGroup) return;
        getMouseNDC(event);
        raycaster.setFromCamera(mouse, camera);
        if (raycaster.ray.intersectPlane(dragPlane, intersectPoint)) {
            selectedGroup.position.copy(intersectPoint.sub(dragOffset));
        }
    }

    function onPointerUp() {
        isDragging = false;
        selectedGroup = null;
        orbitControls.enabled = true;
        renderer.domElement.style.cursor = 'grab';
    }

    // ---- Loop de animación ----

    function animate() {
        requestAnimationFrame(animate);
        if (orbitControls) orbitControls.update();
        if (renderer && scene && camera) renderer.render(scene, camera);
    }

    window.addEventListener('load', init3D);
    window.addEventListener('resize', () => {
        if (!camera || !renderer) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
    </script>
</body>
</html>
