<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona tu Perfil - Arquikids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .bg-gradient-blue-custom {
            background: radial-gradient(circle at center, #2563eb 0%, #1e40af 100%);
        }
        .btn-play-gradient {
            background: linear-gradient(to right, #3b82f6, #2563eb);
        }
        .card-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .avatar-selected {
            background-color: #dbeafe; 
            border: 3px solid #3b82f6;
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-gradient-blue-custom min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto mb-6">
        <a href="index.html" class="text-white font-bold flex items-center gap-2 hover:opacity-80 transition-opacity">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
            Volver
        </a>
    </div>

    <div class="text-center mb-12 text-white">
        <h1 class="text-6xl font-bold mb-2">Selecciona tu Perfil</h1>
        <p class="text-xl opacity-90">¿Quién va a jugar hoy? </p>
    </div>

    <div id="contenedor-perfiles" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        
        <div class="bg-white rounded-[2rem] p-6 card-shadow flex flex-col items-center">
            <img src="https://img.icons8.com/bubbles/200/robot-vacuum.png" class="w-32 h-32 mb-2">
            <h2 class="text-2xl font-bold text-gray-800">Brisa</h2>
            <p id="puntos-Brisa" class="text-yellow-500 font-bold mb-4 flex items-center gap-1">⭐ 0 puntos</p>
            <div class="grid grid-cols-3 gap-2 w-full mb-6">
                <div class="bg-blue-50 p-2 rounded-xl text-center">
                    <p id="ensambles-Brisa" class="text-xs font-bold text-gray-400">0</p>
                    <p class="text-[10px] text-gray-500 uppercase">Ensambles</p>
                </div>
                <div class="bg-blue-50 p-2 rounded-xl text-center">
                    <p id="logros-Brisa" class="text-xs font-bold text-gray-400">0</p>
                    <p class="text-[10px] text-gray-500 uppercase">Logros</p>
                </div>
                <div class="bg-blue-50 p-2 rounded-xl text-center">
                    <p id="tiempo-Brisa" class="text-xs font-bold text-gray-400">--:--</p>
                    <p class="text-[10px] text-gray-500 uppercase">Mejor ⏱️</p>
                </div>
            </div>
            <button onclick="seleccionarPerfil('Brisa', 'https://img.icons8.com/bubbles/200/robot-vacuum.png')" class="w-full btn-play-gradient text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90">
                Jugar
            </button>
        </div>

        <div class="bg-white rounded-[2rem] p-6 card-shadow flex flex-col items-center">
            <img src="https://img.icons8.com/bubbles/200/skull.png" class="w-32 h-32 mb-2">
            <h2 class="text-2xl font-bold text-gray-800">Luis</h2>
            <p id="puntos-Luis" class="text-yellow-500 font-bold mb-4 flex items-center gap-1">⭐ 0 puntos</p>
            <div class="grid grid-cols-3 gap-2 w-full mb-6">
                <div class="bg-blue-50 p-2 rounded-xl text-center">
                    <p id="ensambles-Luis" class="text-xs font-bold text-gray-400">0</p>
                    <p class="text-[10px] text-gray-500 uppercase">Ensambles</p>
                </div>
                <div class="bg-blue-50 p-2 rounded-xl text-center">
                    <p id="logros-Luis" class="text-xs font-bold text-gray-400">0</p>
                    <p class="text-[10px] text-gray-500 uppercase">Logros</p>
                </div>
                <div class="bg-blue-50 p-2 rounded-xl text-center">
                    <p id="tiempo-Luis" class="text-xs font-bold text-gray-400">--:--</p>
                    <p class="text-[10px] text-gray-500 uppercase">Mejor ⏱️</p>
                </div>
            </div>
            <button onclick="seleccionarPerfil('Luis', 'https://img.icons8.com/bubbles/200/skull.png')" class="w-full btn-play-gradient text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90">
                Jugar
            </button>
        </div>

        <div id="new-profile-card" class="bg-white bg-opacity-20 border-4 border-dashed border-white rounded-[2rem] p-6 flex flex-col items-center justify-center cursor-pointer transition-all duration-300 min-h-[350px]">
            <div id="plus-content" onclick="abrirFormulario()" class="flex flex-col items-center w-full">
                <span class="text-8xl text-white font-light mb-4">+</span>
                <p class="text-white text-2xl font-bold">Nuevo Perfil</p>
            </div>

            <div id="form-content" class="hidden w-full">
                <h3 class="text-blue-700 text-xl font-bold text-center mb-4">Crear Nuevo Perfil</h3>
                <input type="text" id="nickname" placeholder="Tu nombre" class="w-full p-3 bg-blue-50 border border-blue-200 rounded-xl mb-4 text-gray-700 outline-none focus:ring-2 focus:ring-blue-400">
                <p class="text-blue-700 text-sm font-bold mb-2 text-center">Elige tu avatar:</p>
                <div class="grid grid-cols-4 gap-2 mb-6">
                    <img onclick="selectAvatar(this)" src="img/mapache.png" class="w-full aspect-square cursor-pointer rounded-lg hover:bg-blue-100 transition-all p-1">
                    <img onclick="selectAvatar(this)" src="img/buho.png" class="w-full aspect-square cursor-pointer rounded-lg hover:bg-blue-100 transition-all p-1">
                    <img onclick="selectAvatar(this)" src="img/ardilla.png" class="w-full aspect-square cursor-pointer rounded-lg hover:bg-blue-100 transition-all p-1">
                    <img onclick="selectAvatar(this)" src="https://img.icons8.com/bubbles/100/alien.png" class="w-full aspect-square cursor-pointer rounded-lg hover:bg-blue-100 transition-all p-1">
                    <img onclick="selectAvatar(this)" src="https://img.icons8.com/bubbles/100/ninja.png" class="w-full aspect-square cursor-pointer rounded-lg hover:bg-blue-100 transition-all p-1">
                    <img onclick="selectAvatar(this)" src="https://img.icons8.com/bubbles/100/skull.png" class="w-full aspect-square cursor-pointer rounded-lg hover:bg-blue-100 transition-all p-1">
                    <img onclick="selectAvatar(this)" src="https://img.icons8.com/bubbles/100/unicorn.png" class="w-full aspect-square cursor-pointer rounded-lg hover:bg-blue-100 transition-all p-1">
                    <img onclick="selectAvatar(this)" src="https://img.icons8.com/bubbles/100/wizard.png" class="w-full aspect-square cursor-pointer rounded-lg hover:bg-blue-100 transition-all p-1">
                </div>
                <div class="flex gap-2">
                    <button onclick="crearPerfil()" class="flex-1 bg-blue-600 text-white py-2 rounded-xl font-bold hover:bg-blue-700">Crear</button>
                    <button onclick="cerrarFormulario()" class="flex-1 bg-white border border-gray-200 text-gray-500 py-2 rounded-xl font-bold hover:bg-gray-50">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let avatarElegido = null;
        const card = document.getElementById('new-profile-card');

        // ── Utilidad: formatear segundos → MM:SS ──────────────────────────────
        function formatearTiempo(seg) {
            if (seg === '--' || seg === undefined || seg === null) return '--:--';
            const m = String(Math.floor(seg / 60)).padStart(2, '0');
            const s = String(seg % 60).padStart(2, '0');
            return m + ':' + s;
        }

        // ── Cargar stats de un perfil en su tarjeta ───────────────────────────
        function cargarStats(nombre) {
            const guardado = localStorage.getItem(`perfil_${nombre}`);
            if (!guardado) return;
            const data = JSON.parse(guardado);
            const el = (id) => document.getElementById(id);
            if (el(`puntos-${nombre}`))    el(`puntos-${nombre}`).innerHTML    = `⭐ ${data.puntos || 0} puntos`;
            if (el(`ensambles-${nombre}`)) el(`ensambles-${nombre}`).innerText = data.ensambles || 0;
            if (el(`logros-${nombre}`))    el(`logros-${nombre}`).innerText    = data.logros || 0;
            if (el(`tiempo-${nombre}`))    el(`tiempo-${nombre}`).innerText    = formatearTiempo(data.mejorTiempo);
        }

        window.addEventListener('load', () => {
            const nombres = ['Brisa', 'Luis'];
            nombres.forEach(nombre => cargarStats(nombre));
        });

        function abrirFormulario() {
            document.getElementById('plus-content').classList.add('hidden');
            document.getElementById('form-content').classList.remove('hidden');
            card.classList.remove('bg-opacity-20', 'border-dashed', 'border-white', 'cursor-pointer');
            card.classList.add('bg-opacity-100', 'card-shadow');
        }

        function cerrarFormulario() {
            document.getElementById('form-content').classList.add('hidden');
            document.getElementById('plus-content').classList.remove('hidden');
            card.classList.add('bg-opacity-20', 'border-dashed', 'border-white', 'cursor-pointer');
            card.classList.remove('bg-opacity-100', 'card-shadow');
            avatarElegido = null;
        }

        function selectAvatar(el) {
            document.querySelectorAll('#form-content img').forEach(img => img.classList.remove('avatar-selected'));
            el.classList.add('avatar-selected');
            avatarElegido = el.src;
        }

        function seleccionarPerfil(nombre, avatar) {
            let perfilData = localStorage.getItem(`perfil_${nombre}`);
            if (!perfilData) {
                perfilData = {
                    nombre: nombre,
                    avatar: avatar,
                    puntos: 0,
                    ensambles: 0,
                    logros: 0,
                    mejorTiempo: '--'
                };
                localStorage.setItem(`perfil_${nombre}`, JSON.stringify(perfilData));
            } else {
                perfilData = JSON.parse(perfilData);
            }
            localStorage.setItem('perfilActivo', JSON.stringify(perfilData));
            window.location.href = "menu.html";
        }

        function crearPerfil() {
            const nombre = document.getElementById('nickname').value.trim();
            if (nombre && avatarElegido) {
                const datosUsuario = {
                    nombre: nombre,
                    avatar: avatarElegido,
                    puntos: 0,
                    ensambles: 0,
                    logros: 0,
                    mejorTiempo: '--'
                };
                localStorage.setItem(`perfil_${nombre}`, JSON.stringify(datosUsuario));
                localStorage.setItem('perfilActivo', JSON.stringify(datosUsuario));
                window.location.href = "menu.html"; 
            } else {
                alert("¡No olvides tu nombre y elegir un avatar! ");
            }
        }
    </script>
</body>
</html>
