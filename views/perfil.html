<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona tu Perfil - Arquikids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        /* Gradiente azul para coincidir con el inicio */
        .bg-gradient-blue-custom {
            background: radial-gradient(circle at center, #2563eb 0%, #1e40af 100%);
        }
        .btn-play-gradient {
            background: linear-gradient(to right, #3b82f6, #2563eb);
        }
        .card-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-gradient-blue-custom min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto mb-6">
        <a href="index.html" class="text-white font-bold flex items-center gap-2 hover:opacity-80 transition-opacity">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
            Volver
        </a>
    </div>

    <div class="text-center mb-12 text-white">
        <h1 class="text-6xl font-bold mb-2">Selecciona tu Perfil</h1>
        <p class="text-xl opacity-90">¿Quién va a jugar hoy? 😊</p>
    </div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        
        <div class="bg-white rounded-[2rem] p-6 card-shadow flex flex-col items-center">
            <img src="https://img.icons8.com/bubbles/200/000000/robot.png" class="w-24 h-24 mb-2">
            <h2 class="text-2xl font-bold text-gray-800">Brisa</h2>
            <p class="text-yellow-500 font-bold mb-4 flex items-center gap-1">⭐ 0 puntos</p>
            
            <div class="grid grid-cols-2 gap-2 w-full mb-6">
                <div class="bg-blue-50 p-2 rounded-xl text-center">
                    <p class="text-xs font-bold text-gray-400">0</p>
                    <p class="text-[10px] text-gray-500 uppercase">Ensambles</p>
                </div>
                <div class="bg-blue-50 p-2 rounded-xl text-center">
                    <p class="text-xs font-bold text-gray-400">0</p>
                    <p class="text-[10px] text-gray-500 uppercase">Logros</p>
                </div>
            </div>
            
            <div class="flex gap-2 w-full">
                <a href="menu.html" class="flex-1 btn-play-gradient text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    </svg>
                    Jugar
                </a>
                <button class="bg-red-500 p-3 rounded-xl text-white hover:bg-red-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] p-6 card-shadow flex flex-col items-center">
            <img src="https://img.icons8.com/bubbles/200/000000/skull.png" class="w-24 h-24 mb-2">
            <h2 class="text-2xl font-bold text-gray-800">Luis</h2>
            <p class="text-yellow-500 font-bold mb-4 flex items-center gap-1">⭐ 0 puntos</p>
            
            <div class="grid grid-cols-2 gap-2 w-full mb-6">
                <div class="bg-blue-50 p-2 rounded-xl text-center">
                    <p class="text-xs font-bold text-gray-400">0</p>
                    <p class="text-[10px] text-gray-500 uppercase">Ensambles</p>
                </div>
                <div class="bg-blue-50 p-2 rounded-xl text-center">
                    <p class="text-xs font-bold text-gray-400">0</p>
                    <p class="text-[10px] text-gray-500 uppercase">Logros</p>
                </div>
            </div>
            
            <div class="flex gap-2 w-full">
                <a href="menu.html" class="flex-1 btn-play-gradient text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    </svg>
                    Jugar
                </a>
                <button class="bg-red-500 p-3 rounded-xl text-white hover:bg-red-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            </div>
        </div>

        <div id="new-profile-card" class="bg-white bg-opacity-20 border-4 border-dashed border-white rounded-[2rem] p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-opacity-30 transition-all min-h-[350px]">
            
            <div id="plus-content" onclick="abrirFormulario()" class="flex flex-col items-center">
                <span class="text-8xl text-white font-light mb-4">+</span>
                <p class="text-white text-2xl font-bold">Nuevo Perfil</p>
            </div>

            <div id="form-content" class="hidden w-full">
                <h3 class="text-blue-700 text-xl font-bold text-center mb-4">Crear Nuevo Perfil</h3>
                <input type="text" id="nickname" placeholder="Tu nombre" class="w-full p-3 bg-blue-50 rounded-xl mb-4 text-gray-700 outline-none focus:ring-2 focus:ring-blue-400">
                
                <p class="text-blue-700 text-sm font-bold mb-2 text-center">Elige tu avatar:</p>
                <div class="grid grid-cols-4 gap-2 mb-6">
                    <img onclick="selectAvatar(this)" src="https://img.icons8.com/bubbles/100/000000/robot.png" class="w-12 h-12 cursor-pointer rounded-lg hover:bg-blue-100 transition-colors p-1">
                    <img onclick="selectAvatar(this)" src="https://img.icons8.com/bubbles/100/000000/astronaut.png" class="w-12 h-12 cursor-pointer rounded-lg hover:bg-blue-100 transition-colors p-1">
                    <img onclick="selectAvatar(this)" src="https://img.icons8.com/bubbles/100/000000/superhero.png" class="w-12 h-12 cursor-pointer rounded-lg hover:bg-blue-100 transition-colors p-1">
                    <img onclick="selectAvatar(this)" src="https://img.icons8.com/bubbles/100/000000/sci-fi.png" class="w-12 h-12 cursor-pointer rounded-lg hover:bg-blue-100 transition-colors p-1">
                    <img onclick="selectAvatar(this)" src="https://img.icons8.com/bubbles/100/000000/ninja.png" class="w-12 h-12 cursor-pointer rounded-lg hover:bg-blue-100 transition-colors p-1">
                    <img onclick="selectAvatar(this)" src="https://img.icons8.com/bubbles/100/000000/skull.png" class="w-12 h-12 cursor-pointer rounded-lg hover:bg-blue-100 transition-colors p-1">
                    <img onclick="selectAvatar(this)" src="https://img.icons8.com/bubbles/100/000000/unicorn.png" class="w-12 h-12 cursor-pointer rounded-lg hover:bg-blue-100 transition-colors p-1">
                    <img onclick="selectAvatar(this)" src="https://img.icons8.com/bubbles/100/000000/wizard.png" class="w-12 h-12 cursor-pointer rounded-lg hover:bg-blue-100 transition-colors p-1">
                </div>

                <div class="flex gap-2">
                    <button onclick="crearPerfil()" class="flex-1 bg-blue-600 text-white py-2 rounded-xl font-bold hover:bg-blue-700">Crear</button>
                    <button onclick="cerrarFormulario()" class="flex-1 bg-white border border-gray-200 text-gray-500 py-2 rounded-xl font-bold hover:bg-gray-50">Cancelar</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let avatarElegido = null;

        function abrirFormulario() {
            document.getElementById('plus-content').classList.add('hidden');
            document.getElementById('form-content').classList.remove('hidden');
            document.getElementById('new-profile-card').classList.remove('bg-opacity-20', 'border-dashed');
            document.getElementById('new-profile-card').classList.add('bg-white', 'bg-opacity-100');
        }

        function cerrarFormulario() {
            document.getElementById('form-content').classList.add('hidden');
            document.getElementById('plus-content').classList.remove('hidden');
            document.getElementById('new-profile-card').classList.add('bg-opacity-20', 'border-dashed');
            document.getElementById('new-profile-card').classList.remove('bg-white', 'bg-opacity-100');
        }

        function selectAvatar(el) {
            document.querySelectorAll('#form-content img').forEach(img => img.classList.remove('bg-blue-200', 'ring-2', 'ring-blue-500'));
            el.classList.add('bg-blue-200', 'ring-2', 'ring-blue-500');
            avatarElegido = el.src;
        }

        function crearPerfil() {
            const nombre = document.getElementById('nickname').value;
            if (nombre && avatarElegido) {
                window.location.href = "menu.html";
            } else {
                alert("Por favor escribe tu nombre y elige un avatar");
            }
        }
    </script>

</body>
</html>
